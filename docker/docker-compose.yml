version: '3.9'

services:
  # ==================== POSTGRESQL DATABASE ====================
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_calendar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calendaruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendarpass}
      POSTGRES_DB: ${POSTGRES_DB:-calendar_agent}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendaruser} -d ${POSTGRES_DB:-calendar_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - calendar_network

  # ==================== REDIS CACHE ====================
  redis:
    image: redis:7-alpine
    container_name: whatsapp_calendar_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redispass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - calendar_network

  # ==================== LITELLM (Model Fallback Router) ====================
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: whatsapp_litellm
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-litellm_master_key_change_me}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    volumes:
      - ../backend/litellm_config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - calendar_network

  # ==================== HERMES AGENT (AI Brain + Memory) ====================
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: whatsapp_hermes
    restart: unless-stopped
    # Run in gateway mode (not TUI) so the OpenAI-compatible API server starts.
    # API_SERVER_ENABLED=true activates the endpoint on port 8642.
    # All messaging platforms are disabled in config.yaml — we use OpenWA instead.
    command: gateway
    stdin_open: true
    tty: true
    env_file:
      - ../backend/.env
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_PORT: "8642"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${HERMES_API_KEY:-hermes_api_key_change_me}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-litellm_master_key_change_me}
      OPENAI_BASE_URL: http://litellm:4000/v1
    volumes:
      - hermes_data:/opt/data
      - ../backend/hermes_config.yaml:/opt/data/config.yaml:ro
    ports:
      - "8642:8642"
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - calendar_network

  # ==================== MCP SERVER (Tool Bridge for Hermes) ====================
  mcp-server:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: whatsapp_mcp_server
    restart: unless-stopped
    command: python -m app.mcp_server.main
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app:ro
      - token_storage:/app/tokens
    networks:
      - calendar_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/sse')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ==================== EVOLUTION API (WhatsApp Protocol Adapter) ====================
  # Replaces openwa/openwa (which has no public Docker image).
  # Evolution API is the most widely-used Baileys-based WhatsApp REST API.
  # REST docs: https://doc.evolution-api.com/
  openwa:
    image: atendai/evolution-api:v2.2.3
    container_name: whatsapp_openwa
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SERVER_URL: http://openwa:8080

      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${OPENWA_API_KEY:-openwa_master_key_change_me}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-calendaruser}:${POSTGRES_PASSWORD:-calendarpass}@postgres:5432/evolution_api

      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"

      # Cache
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-redispass}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"

      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"

      LOG_LEVEL: ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      LOG_COLOR: "true"

    ports:
      - "2785:8080"
    volumes:
      - evolution_data:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ | grep -q 'Evolution API' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - calendar_network

  # ==================== FASTAPI BACKEND (Webhook API) ====================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: whatsapp_calendar_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENWA_BASE_URL: http://openwa:8080
      HERMES_BASE_URL: http://hermes:8642
      LITELLM_BASE_URL: http://litellm:4000

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hermes:
        condition: service_healthy

    volumes:
      - ../backend/app:/app/app:ro
      - token_storage:/app/tokens
      - logs:/app/logs
      - //var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - calendar_network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== AGENT WORKER (Message Processing) ====================
  agent_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: whatsapp_calendar_agent_worker
    restart: unless-stopped
    command: python -m app.workers.agent_worker
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENWA_BASE_URL: http://openwa:8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

    volumes:
      - ../backend/app:/app/app:ro
      - token_storage:/app/tokens
      - logs:/app/logs

    networks:
      - calendar_network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Workers don't run an HTTP server — health check is process-based
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==================== SCHEDULER WORKER (Proactive Notifications) ====================
  scheduler_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: whatsapp_calendar_scheduler_worker
    restart: unless-stopped
    command: python -m app.workers.scheduler_worker
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENWA_BASE_URL: http://openwa:8080

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

    volumes:
      - ../backend/app:/app/app:ro
      - token_storage:/app/tokens
      - logs:/app/logs

    networks:
      - calendar_network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ==================== VOLUMES ====================
volumes:
  postgres_data:
    driver: local
    name: whatsapp_calendar_postgres_data

  redis_data:
    driver: local
    name: whatsapp_calendar_redis_data

  token_storage:
    driver: local
    name: whatsapp_calendar_tokens

  logs:
    driver: local
    name: whatsapp_calendar_logs

  hermes_data:
    driver: local
    name: whatsapp_hermes_data

  evolution_data:
    driver: local
    name: whatsapp_evolution_data

# ==================== NETWORKS ====================
networks:
  calendar_network:
    driver: bridge
    name: whatsapp_calendar_network
