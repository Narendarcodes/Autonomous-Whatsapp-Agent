# ============================================================
# omniWA — Simplified Stack (post-migration)
#
# DROPPED vs previous stack:
#   - litellm        → Hermes native provider fallback chain
#   - mcp-server     → Hermes native tools (ADR-0003 revised: T2)
#   - openwa (Evolution API) → Hermes native Baileys bridge
#   - whisper-api    → Hermes native transcription
#   - kokoro-api     → Hermes native TTS
#
# KEPT (5): postgres, redis, hermes (brain + WhatsApp bridge),
#           backend (auth/OAuth/cascade/dashboard), tunnel.
#
# Multi-tenant: one Hermes process serves N tenant profiles;
# Google tokens live encrypted in Postgres (customer_google_tokens),
# NEVER as a shared global token file.
# ============================================================

services:
  # ==================== POSTGRESQL DATABASE ====================
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_calendar_db
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calendaruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendarpass}
      POSTGRES_DB: ${POSTGRES_DB:-calendar_agent}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendaruser} -d ${POSTGRES_DB:-calendar_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    networks:
      - calendar_network

  # ==================== REDIS (sessions, OAuth state, rate-limit, QR, idempotency) ====================
  redis:
    image: redis:7-alpine
    container_name: whatsapp_calendar_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-redispass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - calendar_network

  # ==================== HERMES AGENT (brain + native WhatsApp bridge) ====================
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: whatsapp_hermes
    restart: unless-stopped
    command: gateway
    stdin_open: true
    tty: true
    env_file:
      - ../backend/.env
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_PORT: "8642"
      API_SERVER_HOST: "0.0.0.0"
      # NOTE: model routing is Hermes-native now (fallback_providers in
      # /opt/data/config.yaml). LiteLLM is dropped.
      #
      # WhatsApp bridge config (mode, allowlist, policies) lives in
      # ../backend/.env under "WHATSAPP BRIDGE" — no mode hardcoded here.
      # env_file already injects it; add overrides ONLY if compose-specific
      # values are ever needed.
    volumes:
      - hermes_data:/opt/data
    ports:
      - "8642:8642"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - calendar_network

  # ==================== FASTAPI BACKEND (auth + OAuth + cascade + dashboard) ====================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: whatsapp_calendar_backend
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      APP_NAME: "omniWA"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HERMES_BASE_URL: http://hermes:8642
      BASE_URL: ${BASE_URL:-https://api.narendar.tech}
      # Replies delivered by Hermes' Baileys bridge (Evolution dropped):
      HERMES_OWNS_WHATSAPP: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hermes:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app:ro
      - ../backend/tests:/app/tests:ro
      - token_storage:/app/tokens
      - logs:/app/logs
      - hermes_data:/opt/hermes_data   # legacy default-tenant dev sync only
    networks:
      - calendar_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== CLOUDFLARE TUNNEL ====================
  # Requires your real tunnel token: put TUNNEL_TOKEN=eyJ... in docker/.env
  # (get it from Cloudflare Zero Trust → Networks → Tunnels → your tunnel).
  # Then: docker compose --profile public up -d
  # Profile-gated so the core stack runs fine locally without it.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: whatsapp_tunnel
    restart: unless-stopped
    profiles: ["public"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - backend
    networks:
      - calendar_network

# ==================== VOLUMES ====================
volumes:
  postgres_data:
    driver: local
    name: whatsapp_calendar_postgres_data

  redis_data:
    driver: local
    name: whatsapp_calendar_redis_data

  token_storage:
    driver: local
    name: whatsapp_calendar_tokens

  logs:
    driver: local
    name: whatsapp_calendar_logs

  hermes_data:
    driver: local
    name: whatsapp_hermes_data

# ==================== NETWORKS ====================
networks:
  calendar_network:
    driver: bridge
    name: whatsapp_calendar_network
