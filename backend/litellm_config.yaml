router_settings:
  routing_strategy: simple-shuffle
  retry_policy:
    RateLimitError: 0
    ServiceUnavailableError: 3
    TimeoutError: 2
    AuthenticationError: 0
    NotFoundError: 0
  allowed_fails: 2
  cooldown_time: 30
litellm_settings:
  success_callback: []
  failure_callback: []
  request_timeout: 45
  drop_params: true
  set_verbose: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: false
