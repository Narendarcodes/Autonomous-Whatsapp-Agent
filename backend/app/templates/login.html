<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniWA | Authentication</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=5" />
    <meta name="description" content="Authenticate to OmniWA, the autonomous WhatsApp AI assistant dashboard." />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#25D366',
                        secondary: '#0A0D14',
                        surface: '#121418',
                        line: 'rgba(255,255,255,0.10)'
                    },
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
        }
        body {
            background:
                radial-gradient(circle at 15% 20%, rgba(37, 211, 102, 0.20), transparent 22%),
                radial-gradient(circle at 85% 15%, rgba(37, 211, 102, 0.10), transparent 18%),
                linear-gradient(180deg, #0A0D14 0%, #121418 100%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .glow {
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
        }
        input:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid rgba(37, 211, 102, 0.35);
            outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body class="font-sans min-h-screen flex items-center justify-center relative overflow-hidden text-white">
    <a href="#login-card" class="sr-only focus:not-sr-only focus:absolute focus:z-50 focus:top-4 focus:left-4 focus:px-4 focus:py-2 focus:rounded-full focus:bg-white focus:text-secondary">Skip to login form</a>
    <div class="absolute inset-0 pointer-events-none opacity-90">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-primary/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-8rem] right-[-6rem] w-[30rem] h-[30rem] bg-white/5 rounded-full blur-3xl"></div>
    </div>

    <main class="w-full max-w-md p-6 relative z-10">
        <section id="login-card" class="glass glow rounded-[28px] p-8 md:p-10 shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center p-3 rounded-2xl bg-primary/10 border border-primary/20 mb-5 shadow-lg shadow-black/20">
                    <img src="/logo.svg?v=5" alt="OmniWA Logo" class="w-14 h-14 object-contain drop-shadow-md" />
                </div>
                <h1 class="font-display text-4xl font-semibold tracking-tight text-white">
                    OmniWA
                </h1>
                <p class="text-white/68 mt-3 font-medium leading-relaxed">
                    Autonomous WhatsApp AI assistant dashboard
                </p>
            </div>

            <form action="/login" method="POST" class="space-y-5">
                <div class="space-y-2">
                    <label for="password" class="block text-sm font-semibold text-white/82">Admin password</label>
                    <input type="password" name="password" id="password" required
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        aria-describedby="password-help error-box"
                        class="w-full px-4 py-3.5 rounded-2xl border border-white/10 bg-white/6 text-white placeholder:text-white/32 transition focus:border-primary/40">
                    <p id="password-help" class="text-xs text-white/48 leading-relaxed">
                        Use the administrator password for this deployment.
                    </p>
                </div>

                <div id="error-box" class="hidden state-message" data-tone="danger" role="alert" aria-live="assertive">
                    <p class="font-semibold text-white">Incorrect password.</p>
                    <p class="text-sm text-white/72 mt-1">Check the credentials and try again.</p>
                </div>

                <button type="submit"
                    class="w-full py-3.5 bg-primary hover:bg-primary/90 text-secondary rounded-2xl font-semibold shadow-lg shadow-black/20 transition active:scale-[0.99] duration-150">
                    Authenticate session
                </button>
            </form>

            <div class="mt-8 pt-5 border-t border-white/10 flex items-center justify-between text-xs text-white/42">
                <span>OmniWA AI Assistant</span>
                <span>© 2026</span>
            </div>
        </section>

        <p class="text-center mt-6 text-xs text-white/38 leading-relaxed">
            Secure admin access for autonomous chat, scheduling, and voice workflows.
        </p>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const errorBox = document.getElementById('error-box');
        const password = document.getElementById('password');
        if (urlParams.get('error') === 'true' && errorBox) {
            errorBox.classList.remove('hidden');
            password.setAttribute('aria-invalid', 'true');
            password.focus();
        } else if (password) {
            password.focus();
        }
    </script>
</body>
</html>
