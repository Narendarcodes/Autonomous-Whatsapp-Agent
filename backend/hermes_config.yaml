# Hermes Agent Configuration
# Secrets come from environment variables set in docker-compose.
# Docs: https://hermes-agent.nousresearch.com/docs/user-guide/configuration

# ==================== NAMED CUSTOM PROVIDER ====================
# Register our LiteLLM proxy as a named custom provider.
# This is the correct way to use an OpenAI-compatible proxy endpoint.
custom_providers:
  - name: litellm
    base_url: http://litellm:4000/v1
    api_key_env: OPENAI_API_KEY

# ==================== LLM BACKEND ====================
# Point the model to our named custom provider "litellm".
# model.default is the model ID to send in API requests (must match
# what LiteLLM exposes in its model list).
model:
  provider: "custom:litellm"
  default: hermes-llm
  max_tokens: 4096
  temperature: 0.3

# ==================== MCP TOOLS ====================
mcp_servers:
  whatsapp-agent-tools:
    url: http://mcp-server:9000/sse
    transport: sse

# ==================== MESSAGING GATEWAYS ====================
# WhatsApp MUST stay disabled — we use OpenWA as the WhatsApp layer.
messaging:
  whatsapp:
    enabled: false
  telegram:
    enabled: false
  discord:
    enabled: false

# ==================== BUILT-IN TOOLS ====================
tools:
  terminal:
    enabled: true
  file_operations:
    enabled: true
  web_search:
    enabled: true
  web_browser:
    enabled: true
  image_generation:
    enabled: true
  vision:
    enabled: true

# ==================== LOGGING ====================
logging:
  level: info
  file: /opt/data/hermes.log
