# Hermes Agent Configuration
# Secrets come from environment variables set in docker-compose.
# Docs: https://hermes-agent.nousresearch.com/docs/user-guide/configuration

# ==================== LLM BACKEND ====================
# Use 'openai' provider for any OpenAI-compatible endpoint (including LiteLLM).
# api_key is read from OPENAI_API_KEY env var.
# base_url is read from OPENAI_BASE_URL env var (set in docker-compose).
model:
  provider: openai
  name: hermes-llm
  max_tokens: 4096
  temperature: 0.3

# ==================== MCP TOOLS ====================
mcp:
  servers:
    - name: whatsapp-agent-tools
      url: http://mcp-server:9000/sse
      transport: sse

# ==================== MESSAGING GATEWAYS ====================
# WhatsApp MUST stay disabled — we use OpenWA as the WhatsApp layer.
messaging:
  whatsapp:
    enabled: false
  telegram:
    enabled: false
  discord:
    enabled: false

# ==================== BUILT-IN TOOLS ====================
tools:
  terminal:
    enabled: false
  file_operations:
    enabled: false
  web_search:
    enabled: true
  web_browser:
    enabled: false
  image_generation:
    enabled: false
  vision:
    enabled: false

# ==================== LOGGING ====================
logging:
  level: info
  file: /opt/data/hermes.log
